[package]
name = "storyquest-studio"
version = "1.0.0"
description = "StoryQuest Studio - Gamified AI-Powered Animated Storytelling Production Manager for Windows"
authors = ["StoryQuest Studio Engineering"]
license = "MIT"
repository = "https://github.com/storyquest-studio/storyquest-studio"
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "storyquest_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6.1", features = ["windows-native"] }
sha2 = "0.11"
base64 = "0.22"
urlencoding = "2"
dotenvy = "0.15"
thiserror = "2.0.3"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
